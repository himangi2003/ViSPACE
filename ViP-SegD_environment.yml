name: vipsegd

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  - pip:
    # ── PyTorch (CUDA 12.1) ──────────────────────────────────────────────────
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.5.1+cu121
    - torchvision==0.20.1+cu121

    # ── Virchow2 encoder ─────────────────────────────────────────────────────
    - timm==1.0.17
    - huggingface-hub==0.33.4
    - safetensors==0.5.3
    - transformers==4.53.2
    - ml-dtypes==0.5.3

    # ── OpenCLIP ─────────────────────────────────────────────────────────────
    - open_clip_torch==2.32.0

    # ── Mussel folder dependencies (tessellation) ────────────────────────────
    # Mussel is used as a local folder — not pip installed.
    # Only the packages Mussel imports at runtime are listed here.
    - omegaconf==2.3.0
    - hydra-core==1.3.2
    - h5py==3.14.0
    - tiffslide==2.5.1
    - tifffile==2025.5.10
    - imagecodecs==2025.3.30
    - einops==0.8.1

    # ── Image processing (segmentation + stitching) ──────────────────────────
    - opencv-python-headless==4.12.0.88
    - pillow==11.3.0
    - numpy==2.2.6
    - scikit-image==0.25.2

    # ── Data handling ────────────────────────────────────────────────────────
    - pandas==2.3.1
    - tqdm==4.67.1

    # ── Spatial / GeoJSON (TME feature extraction) ───────────────────────────
    - geopandas==1.1.1
    - shapely==2.1.1
    - pyogrio==0.11.0
    - pyproj==3.7.1
    - scipy==1.16.0

    # ── Survival analysis ────────────────────────────────────────────────────
    - lifelines==0.30.0
    - statsmodels==0.14.6
    - scikit-learn==1.7.0

    # ── Visualisation ────────────────────────────────────────────────────────
    - matplotlib==3.10.3
    - seaborn==0.13.2

    # ── Jupyter (notebook walkthrough) ───────────────────────────────────────
    - jupyterlab==4.4.7
    - ipykernel==6.29.5
    - ipywidgets==8.1.8